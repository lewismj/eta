[package]
name = "standalone_app"
version = "0.1.0"
license = "MIT"

[compatibility]
eta = ">=0.6, <0.8"

[dependencies]
standalone_lib = { path = "../standalone_lib" }

[native]
kind = "sidecar"
abi = "eta-native-v1"
id = "standalone_app_native"
entry = "eta_register_extension_v1"

[[native.targets]]
triple = "x86_64-pc-windows-msvc"
