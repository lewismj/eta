name: ci

# Build and test gate. Runs on push to main and on PRs, and is called by
# release.yml so a release bundle is only built from a tree that passes.
#
#   linux-release    Release, GCC; also eta_fmt --check and eta_lint on stdlib + cookbook
#   linux-gc-torture Release, GCC; gc_rooting_tests + cookbook, ETA_GC_TORTURE=20
#   linux-fuzz-smoke Clang + libFuzzer/ASan; every fuzz target, seeds + 20k fixed-seed runs
#                    (long time-boxed runs live in fuzz.yml, started by hand)
#   windows-release  Release, MSVC

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ETA_LIBTORCH_VER: 2.11.0
  CI_TARGETS: eta_core_test eta_pkg_test eta_cli_test eta_test
  CI_TESTS: ^(eta_core_test|eta_pkg_test|eta_cli_test|eta_stdlib_tests)$

jobs:
  linux:
    name: linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build uuid-dev libssl-dev ccache

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-linux-

      - name: Install Boost via vcpkg
        env:
          X_VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install boost-test:x64-linux boost-unordered:x64-linux

      - name: Cache libtorch download
        uses: actions/cache@v4
        with:
          path: build/_libtorch_dl
          key: libtorch-linux-cpu-${{ env.ETA_LIBTORCH_VER }}

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release
          max-size: 2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target $CI_TARGETS eta_formatter eta_linter

      - name: Test
        run: ctest --test-dir build --output-on-failure -R "$CI_TESTS"

      # Formatter/linter gates for the Eta corpora (formerly lint.yml). They run
      # even when tests fail so all problems surface in one CI pass.
      # On failure, print the diff and the formatter version, and upload a patch
      # that fixes it (download, then: git apply eta-fmt.patch).
      - name: Check formatting
        if: success() || failure()
        shell: bash
        run: |
          fmt=./build/eta/tools/formatter/eta_fmt
          if "$fmt" --check stdlib cookbook; then exit 0; fi
          echo "::group::eta_fmt version"
          "$fmt" --version
          echo "::endgroup::"
          echo "::group::Formatting diff (apply with: git apply eta-fmt.patch)"
          "$fmt" --diff --no-color stdlib cookbook > eta-fmt.patch || true
          cat eta-fmt.patch
          echo "::endgroup::"
          echo "::group::Line endings / encoding of differing files"
          for f in $(grep -E '^\+\+\+ ' eta-fmt.patch | sed -E 's#^\+\+\+ (b/)?##'); do
            file "$f"
            printf '%s: CRLF lines=%s, trailing newline=%s\n' "$f" \
              "$(grep -c $'\r$' "$f" || true)" \
              "$( [ -z "$(tail -c1 "$f")" ] && echo yes || echo no )"
          done
          echo "::endgroup::"
          echo "::error title=eta_fmt::Formatting differs; download the eta-fmt-patch artifact and run: git apply eta-fmt.patch"
          exit 1

      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eta-fmt-patch
          path: eta-fmt.patch
          if-no-files-found: ignore

      - name: Run linter
        if: success() || failure()
        run: ./build/eta/tools/linter/eta_lint --max-warnings 0 --format github stdlib cookbook

  # GC rooting gate: collect every 20th allocation (ETA_GC_TORTURE, see
  # heap.h) while running the rooting regressions and the whole cookbook.
  # An unrooted temporary shows up as a crash, wrong output or a hang.
  gc-torture:
    name: linux-gc-torture
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build uuid-dev libssl-dev ccache

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-linux-

      - name: Install Boost via vcpkg
        env:
          X_VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install boost-test:x64-linux boost-unordered:x64-linux

      - name: Cache libtorch download
        uses: actions/cache@v4
        with:
          path: build/_libtorch_dl
          key: libtorch-linux-cpu-${{ env.ETA_LIBTORCH_VER }}

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gc-torture
          max-size: 2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target eta_core_test

      - name: GC torture (interval 20)
        working-directory: build
        env:
          ETA_GC_TORTURE: 20
          ETA_MODULE_PATH: ""
        run: |
          exe="$(find "$GITHUB_WORKSPACE/build" -type f -name eta_core_test -perm -u+x | head -n1)"
          test -n "$exe" || { echo "eta_core_test not found"; exit 1; }
          "$exe" --log_level=test_suite \
            --run_test=gc_rooting_tests:example_runner_tests:compiled_example_tests

  # Fuzz smoke: build every libFuzzer target and run each one deterministically
  # (-seed=1, seeds then 20k mutations) via scripts/fuzz.sh. Catches build rot
  # and regressions on the seed corpora; open-ended fuzzing is fuzz.yml.
  fuzz-smoke:
    name: linux-fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build uuid-dev libssl-dev ccache \
            clang-19 clang-tools-19 libclang-rt-19-dev

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-linux-

      - name: Install Boost via vcpkg
        env:
          X_VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install boost-test:x64-linux boost-unordered:x64-linux

      - name: Cache libtorch download
        uses: actions/cache@v4
        with:
          path: build/_libtorch_dl
          key: libtorch-linux-cpu-${{ env.ETA_LIBTORCH_VER }}

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-fuzz
          max-size: 2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-19 \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build fuzzers
        run: cmake --build build --target eta_fuzz_all

      - name: Fuzz (deterministic smoke)
        run: bash scripts/fuzz.sh --build-dir build --out build/fuzz-out --runs 20000

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-failures
          path: |
            build/fuzz-out/artifacts
            build/fuzz-out/*.log
          if-no-files-found: ignore

  windows:
    name: windows-release
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: vcpkg-windows-

      - name: Install Boost via vcpkg
        shell: pwsh
        env:
          X_VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkg = "${{ runner.temp }}\vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg" install boost-test:x64-windows boost-unordered:x64-windows openssl:x64-windows
          echo "VCPKG_DIR=$vcpkg" >> $env:GITHUB_ENV

      - name: Cache libtorch download
        uses: actions/cache@v4
        with:
          path: build/_libtorch_dl
          key: libtorch-windows-cpu-${{ env.ETA_LIBTORCH_VER }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_DIR }}\scripts\buildsystems\vcpkg.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target $env:CI_TARGETS.Split(' ')

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -R '${{ env.CI_TESTS }}'
